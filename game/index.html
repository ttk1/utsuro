<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<!-- 外から読むのは Google Fonts だけ。GitHub Pages ではヘッダーを付けられないので meta で指定する -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<title>無人放送</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=DotGothic16&display=swap">
<style>
/* 画面内デスクトップ型。2026年は透のノートPC（深夜の暗いテーマ）、2036年はミオの事務所の端末（明るいテーマ） */
:root{
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-ui:system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-dot:"DotGothic16","IBM Plex Mono",monospace;
  --map-land:#171c29; --map-block:#1f2536; --map-road:#2e3650; --map-rail:#9aa3c2;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#000}
/* 語りを続けてタップしたときに、iPhone がダブルタップと見なして画面を拡大しないようにする（ピンチでの拡大はできる） */
html{touch-action:manipulation}
body{font-family:var(--f-ui);font-size:14px;line-height:1.7;overflow:hidden}
button{font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ===== テーマ ===== */
#screen{position:fixed;inset:0;display:grid;grid-template-rows:minmax(0,1fr) 44px;grid-template-columns:minmax(0,1fr);color:var(--fg)}
#screen.y2026{
  --win:#1f2024; --tb:#2a2c31; --tb-on:#33363c; --bg:#141518; --surface:#1f2024; --surface2:#2a2c31; --line:#383b42;
  --fg:#e4e4e7; --muted:#9a9ca5; --accent:#e5a13f; --accent-dim:#6e5124; --red:#e8777b; --ok:#7fb59a; --ok-bg:#16201d; --task-bg:#221d14;
  --focus:#5b8def; --bar:rgba(10,11,14,.94); --bar-fg:#cfd1d6; --icon-fg:#e9eaee;
  --wall:radial-gradient(1100px 700px at 72% 28%,#1c2940 0%,#0d1119 58%,#06080c 100%);
  color-scheme:dark;
}
#screen.y2036{
  --win:#fbfbfa; --tb:#e9e8e4; --tb-on:#f4f3f0; --bg:#ffffff; --surface:#f4f3f0; --surface2:#ebe9e4; --line:#d6d3cc;
  --fg:#1f2126; --muted:#666a74; --accent:#a8670b; --accent-dim:#e3c48f; --red:#b83f44; --ok:#2f7d5b; --ok-bg:#e8f3ee; --task-bg:#fbf5ea;
  --focus:#2f6fe0; --bar:rgba(246,246,244,.95); --bar-fg:#23262c; --icon-fg:#1d2026;
  --wall:linear-gradient(165deg,#d5dde4 0%,#aebac6 100%);
  color-scheme:light;
}
/* 2036年のミオの古いノートPC（第二話）。透に見つかる前から使っている一台なので、事務所の端末とは別の暗いテーマにする */
#screen.mio{
  --win:#1c2022; --tb:#262b2e; --tb-on:#2f3539; --bg:#111416; --surface:#1c2022; --surface2:#262b2e; --line:#353c40;
  --fg:#e2e6e8; --muted:#939ba1; --accent:#79bfae; --accent-dim:#2f5a52; --red:#e8777b; --ok:#94c79c; --ok-bg:#142019; --task-bg:#132020;
  --focus:#5b8def; --bar:rgba(9,11,12,.94); --bar-fg:#cfd4d6; --icon-fg:#e9edef;
  --wall:radial-gradient(1000px 700px at 30% 30%,#18292a 0%,#0b1112 60%,#050708 100%);
  color-scheme:dark;
}
#desk{position:relative;overflow:hidden;background:var(--wall)}
#wall{position:absolute;inset:0;pointer-events:none}
#wall svg{width:100%;height:100%;display:block}
#desk::after{content:attr(data-mark);position:absolute;right:28px;bottom:150px;font-family:var(--f-mono);font-size:clamp(28px,6vw,64px);letter-spacing:.08em;color:currentColor;opacity:.05;pointer-events:none}

/* ===== デスクトップのアイコン ===== */
#icons{position:absolute;left:12px;top:12px;bottom:150px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:6px}
#icons button{width:84px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;background:transparent;border:1px solid transparent;border-radius:6px;color:var(--icon-fg);cursor:pointer;font-size:12px;line-height:1.35}
#icons button:hover{background:rgba(127,140,170,.16);border-color:rgba(127,140,170,.25)}
#icons .tile{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;color:#fff;font-size:24px;box-shadow:0 2px 6px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.y2026 #icons span.lb,.mio #icons span.lb{text-shadow:0 1px 3px #000}
.t-chat{background:linear-gradient(#3fb37f,#23875c)} .t-web{background:linear-gradient(#5b8def,#3561c2)} .t-map{background:linear-gradient(#e0a64a,#b67718)}
.t-term{background:linear-gradient(#3a3d45,#1c1e22)} .t-rec{background:linear-gradient(#d65a5f,#a3343a)} .t-wave{background:linear-gradient(#8b6fd6,#5f45a8)}
.t-sheet{background:linear-gradient(#45a3a3,#2a7676)} .t-note{background:linear-gradient(#f0cf6a,#c99a22);color:#3b2d06} .t-doc{background:linear-gradient(#9aa3b5,#6b7487)}
.t-pin{background:linear-gradient(#e66f8f,#b44463)} .t-diff{background:linear-gradient(#59b5d9,#2d84a8)} .t-people{background:linear-gradient(#b08a66,#7f5d3d)}
.t-lock{background:linear-gradient(#59606e,#323844)} .t-news{background:linear-gradient(#d0d4dc,#9aa1ae);color:#1f2329} .t-image{background:linear-gradient(#7fae5d,#557f37)}

/* ===== ウィンドウ ===== */
.win{position:absolute;display:flex;flex-direction:column;background:var(--win);border:1px solid var(--line);border-radius:8px;box-shadow:0 18px 50px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.25);overflow:hidden;min-width:260px;min-height:160px}
/* 右下のつまみで大きさを変える。CSS の resize は zoom で拡大した画面でポインタより大きく動くので、JS で拡大率を割って動かす */
.win .rz{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none;z-index:1;background:linear-gradient(135deg,transparent 0 55%,var(--line) 55% 62%,transparent 62% 72%,var(--line) 72% 79%,transparent 79%)}
.win[hidden]{display:none}
.win .tb{flex:none;display:flex;align-items:center;gap:6px;height:34px;padding:0 4px 0 12px;background:var(--tb);border-bottom:1px solid var(--line);cursor:grab;user-select:none;touch-action:none}
.win.on .tb{background:var(--tb-on)}
.win .ti{flex:1;display:flex;align-items:center;gap:8px;min-width:0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win.on .ti{color:var(--fg)}
.win .wb{width:30px;height:26px;display:grid;place-items:center;background:transparent;border:0;border-radius:4px;color:var(--muted);cursor:pointer;font-size:16px;line-height:1}
.win .wb:hover{background:var(--surface2);color:var(--fg)}
.win .wb.x:hover{background:#c8414a;color:#fff}
.win .bd{flex:1;min-height:0;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.win .bd.flush{padding:0;gap:0}
.addr{flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--surface2);border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;overflow-x:auto}
.addr span{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:2px 12px}
.page{padding:14px 16px;display:flex;flex-direction:column;gap:12px}

/* ===== 語り（テキストバー） ===== */
#narr{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(860px,calc(100% - 24px));z-index:5000;background:rgba(9,10,14,.94);color:#ecebe6;border:1px solid #3b3e47;border-radius:8px;box-shadow:0 12px 34px rgba(0,0,0,.5);padding:12px 16px 10px 18px;cursor:pointer}
#narr[hidden]{display:none}
#narr .who{font-family:var(--f-ui);font-size:12px;color:#d9a650;letter-spacing:.06em;min-height:1.2em}
#narr .who.frame{color:#9fb3d8}
#narr .txt{font-family:var(--f-display);font-size:16.5px;line-height:1.85;min-height:3.7em}
#narr .txt.frame{color:#c3cfe6}
#narr .ctl{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:2px}
#narr .ctl span{flex:1;font-size:11.5px;color:#8e919b}
#narr .ctl button{background:transparent;border:1px solid #3b3e47;color:#c9cbd1;border-radius:4px;padding:1px 10px;cursor:pointer;font-size:12px}
#narr .more{display:inline-block;margin-left:6px;color:#d9a650;animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* ===== タスクバー ===== */
#bar{display:flex;align-items:center;gap:4px;padding:0 8px;background:var(--bar);color:var(--bar-fg);border-top:1px solid rgba(127,127,127,.25);position:relative;z-index:6000}
#bar button{display:flex;align-items:center;gap:7px;height:34px;padding:0 12px;background:transparent;border:1px solid transparent;border-radius:6px;color:inherit;cursor:pointer;font-size:12.5px;white-space:nowrap}
#bar button:hover{background:rgba(127,127,127,.16)}
#bar .apps{flex:1;display:flex;gap:4px;overflow-x:auto;min-width:0}
#bar .apps button.on{background:rgba(127,127,127,.22);border-color:rgba(127,127,127,.3)}
#bar .apps button.min{opacity:.6}
#bar .clock{font-family:var(--f-mono);font-size:12px;text-align:right;line-height:1.3;padding:0 6px}
#menu{position:absolute;left:8px;bottom:50px;z-index:7000;width:300px;background:var(--win);color:var(--fg);border:1px solid var(--line);border-radius:8px;box-shadow:0 18px 40px rgba(0,0,0,.45);padding:8px;display:flex;flex-direction:column;gap:2px}
#menu[hidden]{display:none}
#menu .h{font-size:11px;color:var(--muted);padding:4px 8px}
#menu button{text-align:left;background:transparent;border:0;border-radius:5px;padding:7px 10px;color:var(--fg);cursor:pointer;font-size:13px}
#menu button:hover:not(:disabled){background:var(--surface2)}
#menu button:disabled{opacity:.4;cursor:not-allowed}
#menu button.cur{font-weight:700}
#menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.toast{position:absolute;right:14px;bottom:154px;z-index:5500;width:min(320px,calc(100% - 28px));display:flex;gap:10px;align-items:flex-start;background:var(--win);color:var(--fg);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.4);padding:10px 12px;cursor:pointer;animation:tin .25s ease-out}
.toast b{display:block;font-size:12.5px}
.toast span{font-size:12.5px;color:var(--muted)}
@keyframes tin{from{transform:translateY(8px);opacity:0}}

/* ===== タイトル・章扉・エンディング ===== */
.over{position:fixed;inset:0;z-index:9000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#030305;color:#e9e7e0;text-align:center;padding:24px}
.over[hidden]{display:none}
#title .bgv{position:absolute;inset:0;opacity:.22;filter:blur(1px) saturate(.6)}
#title .bgv svg{width:100%;height:100%;object-fit:cover}
#title .in{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px}
#title h1{font-family:var(--f-display);font-weight:800;font-size:clamp(44px,9vw,96px);letter-spacing:.14em;margin:0;line-height:1.1}
#title h1 span{color:#e5a13f}
#title p{margin:0;color:#a9abb3;font-family:var(--f-display)}
#title .go{margin-top:18px;background:transparent;color:#e9e7e0;border:1px solid #6b6e78;border-radius:3px;padding:10px 34px;font-size:15px;letter-spacing:.2em;cursor:pointer;font-family:var(--f-display)}
#title .go:hover{border-color:#e5a13f;color:#e5a13f}
#title .eps{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
#title .eps .go{margin-top:12px;min-width:220px}
#title .go small{display:block;font-size:11px;letter-spacing:.12em;color:#8e919b;margin-top:2px}
#title .tip{font-size:12px;color:#7d808a;font-family:var(--f-ui)}
#title .note{position:absolute;bottom:18px;left:0;right:0;font-size:11.5px;color:#6f727c;font-family:var(--f-ui)}
#title::after,#card::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px)}
#card{cursor:pointer;transition:opacity .6s}
#card.out{opacity:0;pointer-events:none}
#card .boot{font-family:var(--f-mono);font-size:12.5px;color:#7f8596;text-align:left;white-space:pre;min-height:1em}
#card .no{font-family:var(--f-mono);font-size:12px;letter-spacing:.3em;color:#e5a13f}
#card h2{font-family:var(--f-display);font-size:clamp(30px,5vw,48px);margin:0;letter-spacing:.12em}
#card .wh{font-family:var(--f-mono);font-size:13px;color:#9a9ca5}
#endov{justify-content:flex-start;overflow:auto;background:#07080b}
.ending{max-width:720px;width:100%;margin:6vh auto;padding:0 8px 48px;display:flex;flex-direction:column;gap:14px;text-align:left;font-family:var(--f-display);font-size:16px;line-height:1.95}
.ending h2{font-size:34px;margin:0;letter-spacing:.1em}
.ending p{margin:0}
.ending .eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;color:#7fb59a}
.ending .epi{border-top:1px solid #2c2f37;padding-top:16px;color:#bfc2d4;display:flex;flex-direction:column;gap:10px}
.ending .present{border-top:1px solid #2c2f37;padding-top:16px;display:flex;flex-direction:column;gap:10px}
.ending .frame{border-left:2px solid #8fa4c9;padding-left:12px;color:#b9c3da}
.ending .who2{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:#8fa4c9}
.ending .teaser{border:1px solid #8fa4c9;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.ending .teaser .t{font-size:22px;font-weight:800;letter-spacing:.1em}
.ending .mono{font-family:var(--f-mono)}
.ending .cap{font-size:12.5px;color:#7d808a;font-family:var(--f-ui)}
.ending .endbtns{display:flex;flex-wrap:wrap;gap:10px}
.ending .back.go2{border-color:#8fa4c9;color:#c3cfe6}
.ending .back{align-self:flex-start;background:transparent;color:#e9e7e0;border:1px solid #6b6e78;padding:8px 22px;cursor:pointer;font-family:var(--f-display);letter-spacing:.1em}

/* ===== アプリの中身 ===== */
.cap{font-size:12.5px;color:var(--muted)}
.mono{font-family:var(--f-mono)}
.chat{display:flex;flex-direction:column;gap:10px;padding:14px}
.bubble{background:var(--surface2);border:1px solid var(--line);padding:8px 12px;border-radius:4px 14px 14px 14px;max-width:86%;font-size:14px;line-height:1.65}
.bubble .n{display:block;font-size:11px;color:var(--muted)}
.bubble.me{align-self:flex-end;border-radius:14px 4px 14px 14px;background:color-mix(in srgb,var(--focus) 22%,var(--surface2))}
.chathead{flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.chathead .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-size:13px;font-weight:700}
.doc{background:#eef0f4;color:#22252e;padding:14px 18px;border-radius:2px;font-size:14px;border:1px solid #d5d8de}
.doc .meta{font-size:12px;color:#6a6f80;margin-bottom:4px}
.doc h4{margin:0 0 6px;font-size:16px}
.doc.draft{background:#e9e5d6;border-left:4px solid #b39a5a}
/* 中身がウィンドウより長いとき、横スクロールを持つ表や切り替えボタンが縦に潰れないようにする */
.tablewrap{overflow-x:auto;flex-shrink:0}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12px;letter-spacing:.05em}
td.m{font-family:var(--f-mono)}
tr.sel td{background:color-mix(in srgb,var(--accent) 22%,transparent)}
tr.pick{cursor:pointer}
tr.pick:hover td{background:var(--surface2)}
.cmp{font-family:var(--f-mono);font-size:14px;background:var(--bg);border:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:4px;overflow-x:auto}
.cmp .d{background:var(--red);color:#fff}
.cmp .verdict{font-family:var(--f-ui);font-size:13px}
.stream{position:relative;background:#000;overflow:hidden;max-width:100%}
.stream svg{display:block;width:100%;height:auto}
.stream .ov{position:absolute;inset:0;pointer-events:none;font-family:var(--f-dot);color:#e8e8e0;font-size:clamp(10px,2vw,14px);background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
.ov .tl{position:absolute;top:8px;left:10px}
.ov .tr{position:absolute;top:8px;right:10px;text-align:right}
.ov .live{color:#ff5e5e}
.diffbox{position:relative;background:#000;max-width:100%}
.diffbox svg{display:block;width:100%;height:auto}
.diffbox .top{position:absolute;inset:0}
.diffbox.diff .top{mix-blend-mode:difference}
.seg{flex-shrink:0;display:flex;flex-wrap:wrap;border:1px solid var(--line);align-self:flex-start;border-radius:5px;overflow:hidden}
.seg button{font-size:13px;background:transparent;color:var(--muted);border:0;padding:6px 14px;cursor:pointer}
.seg button.on{background:var(--accent);color:#1a1206}
.site{background:#07080c;color:#cfc9b8}
.site .body{padding:22px 18px;font-family:var(--f-display)}
.site .body .t{font-size:24px;letter-spacing:.3em}
.site .body p{font-size:14px;color:#8a8577;margin:8px 0 0}
.term{background:#0b0c10;font-family:var(--f-mono);font-size:13px;color:#cdd3e0;display:flex;flex-direction:column;height:100%;--muted:#7f8596}
.term .out{flex:1;min-height:120px;padding:12px 14px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.term .out .cmd{color:#e5a13f}
.term .out .dim{color:var(--muted)}
.term form{display:flex;border-top:1px solid #23262e}
.term form span{padding:9px 0 9px 12px;color:#e5a13f}
.term input{flex:1;min-width:0;background:transparent;border:0;color:#e4e4e7;font:inherit;padding:9px 10px;outline:none}
.term .chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-top:1px solid #23262e}
.term .chips button{font-size:11.5px;background:#1b1d23;color:#9a9ca5;border:1px solid #2c2f37;padding:3px 8px;cursor:pointer;border-radius:3px}
.slider{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.slider input{flex:1}
.spec{display:flex;align-items:flex-end;gap:3px;height:110px;padding:8px 10px 0;background:#0b0c10;border:1px solid var(--line)}
.spec i{flex:1;background:#3b4566;min-width:0}
.spec i.pk{background:#e5a13f}
.speclab{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--muted);padding:2px 10px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.card{background:var(--surface2);border:1px solid var(--line);padding:12px 14px;font-size:13.5px;border-radius:4px}
.card b{display:block;font-size:15px}
.card .r{color:var(--muted);font-size:12px}
.news{background:#fff;color:#22252e;padding:16px 18px;font-size:14px}
.news .src{font-size:11px;color:#6a6f80;letter-spacing:.06em}
.news h4{font-family:var(--f-display);font-size:19px;margin:4px 0 8px;line-height:1.4}
.scan{background:#e9e4d6;color:#2b2a26;padding:18px;display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.scan .pf{background:#0d0e12;color:#cfc9b8;padding:14px 16px;border:6px solid #f5f2ea;box-shadow:0 2px 6px rgba(0,0,0,.25);transform:rotate(-1deg)}
.scan .hand{font-family:var(--f-display);color:#2d3a72;transform:rotate(-2deg)}
/* 地図 */
.mapapp{background:var(--map-land);display:flex;flex-direction:column;--fg:#d8dae6;--muted:#8b91aa;color:var(--fg)}
.mapbar{display:flex;gap:8px;padding:8px;border-bottom:1px solid #2a3044;flex-wrap:wrap;background:#1b2032}
.mapbar input{flex:1 1 160px;min-width:0;background:#0c0e16;color:var(--fg);border:1px solid #2a3044;padding:7px 12px;font:inherit;border-radius:18px}
.mapbar label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.results{display:flex;flex-direction:column;border-bottom:1px solid #2a3044}
.results:empty{display:none}
.results button{text-align:left;background:transparent;color:var(--fg);border:0;border-bottom:1px solid #2a3044;padding:7px 12px;cursor:pointer;font-size:13px}
.results button span{color:var(--muted);font-size:12px;margin-left:8px}
.mapview svg{display:block;width:100%;height:auto}
.pin{cursor:pointer}
.pin text{font-family:var(--f-ui);font-size:12px;fill:var(--fg);paint-order:stroke;stroke:var(--map-land);stroke-width:4px;stroke-linejoin:round}
.pin.dim{opacity:.3}
.pin.on circle.p{stroke:#e5a13f;stroke-width:3}
.placecard{padding:14px 16px;border-top:1px solid #2a3044;background:#141826;display:flex;flex-direction:column;gap:6px}
.placecard .ttl{font-weight:700;font-size:16px}
.placecard .kind{font-size:12px;color:var(--muted)}
.placecard dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:4px 0;font-size:13.5px}
.placecard dt{color:var(--muted)}
.placecard dd{margin:0}
.review{font-size:13px;background:#0c0e16;padding:7px 10px;border:1px solid #2a3044}
.review .st{color:#e5a13f;font-family:var(--f-mono);font-size:11px}
/* 捜査ノート */
.nt-head{display:flex;flex-direction:column;gap:2px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.nt-head b{font-family:var(--f-display);font-size:18px}
.nt-head span{font-size:12px;color:var(--muted)}
.bd h3{margin:4px 0 0;font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:500}
.steps{display:flex;flex-direction:column;gap:12px}
.task{padding:14px 16px;border:1px solid var(--accent-dim);background:var(--task-bg);border-radius:4px}
.task .num,.done-step .num{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--accent)}
.done-step .num{color:var(--ok)}
.task .q{font-weight:700;margin:2px 0 10px}
.say{display:inline-block;font-size:11.5px;font-weight:500;color:var(--accent);border:1px solid var(--accent-dim);border-radius:3px;padding:0 6px;margin-right:6px}
.ans{display:flex;gap:8px;flex-wrap:wrap}
.ans input[type=text],.ans select{flex:1 1 160px;min-width:0;background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:8px 10px;font:inherit;border-radius:4px}
.opts{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.opts label{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;cursor:pointer;font-size:13.5px}
.opts input{margin-top:5px;accent-color:var(--accent)}
.btn{font-weight:700;background:var(--accent);color:#1a1206;border:0;padding:8px 16px;cursor:pointer;border-radius:4px}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}
.btn.sm{font-size:12.5px;padding:4px 12px}
.feedback{margin-top:8px;font-size:13.5px}
.feedback:empty{display:none}
.feedback.bad{color:var(--red)}
.done-step{padding:10px 14px;border-left:3px solid var(--ok);background:var(--ok-bg);font-size:13.5px}
.done-step b{color:var(--ok)}
.hints{display:flex;flex-direction:column;gap:6px}
.hint{font-size:13px;color:var(--muted);background:var(--bg);padding:8px 10px;border:1px dashed var(--line)}
.solved{padding:14px 16px;border-left:3px solid var(--ok);background:var(--ok-bg);display:flex;flex-direction:column;gap:8px}
.solved p{margin:0}
.solved .btn{align-self:flex-start;margin-top:4px}
.memo-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 10px;font-size:13px}
/* 未読の印、入力中の表示、正解・解明の演出、録画の拡大 */
#icons .tile{position:relative}
.badge{position:absolute;top:-4px;right:-4px;width:13px;height:13px;border-radius:50%;background:#e5484d;border:2px solid rgba(0,0,0,.35)}
.bubble.typing{display:flex;gap:4px;align-items:center;padding:12px 14px;width:max-content}
.bubble.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:dot 1s infinite}
.bubble.typing i:nth-child(2){animation-delay:.15s}.bubble.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.done-step.just{animation:ok 1.2s ease-out}
@keyframes ok{0%{background:color-mix(in srgb,var(--ok) 35%,transparent)}100%{background:var(--ok-bg)}}
.solved{animation:rise .5s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.zoomable .stream{cursor:zoom-in}
.zoomable .stream svg{transition:transform .3s ease}
.zoomable.zoom .stream{cursor:zoom-out}
.zoomable.zoom .stream svg{transform:scale(2.6)}
@media (prefers-reduced-motion:no-preference){
  .flick{animation:flick 6s infinite}
  @keyframes flick{0%,96%,100%{opacity:1}97%{opacity:.75}98%{opacity:1}99%{opacity:.85}}
}
@media (prefers-reduced-motion:reduce){#narr .more,.toast,.bubble.typing i,.done-step.just,.solved{animation:none}.zoomable .stream svg{transition:none}}
/* 狭い画面: アイコン・ウィンドウ・語りを縦に並べ、ウィンドウは一枚ずつ残りの高さいっぱいに開く。
   語りの高さは文の長さで変わるので、決め打ちせず縦並びにして重ならないようにしている */
@media (max-width:760px){
  #desk{display:flex;flex-direction:column}
  #icons{position:relative;inset:auto;flex:none;height:82px;padding:6px 8px;flex-wrap:nowrap;flex-direction:row;overflow-x:auto;gap:2px}
  /* 6 個までなら横にスクロールせず一列に収める。ラベルは文字の途中で折り返さない */
  #icons button{flex:1 0 56px;width:auto;max-width:80px;padding:4px 2px;font-size:11px}
  #icons .lb{word-break:keep-all}
  #icons .tile{width:38px;height:38px;font-size:20px}
  #wins{position:relative;flex:1;min-height:0}
  .win{left:0!important;top:0!important;width:100%!important;height:100%!important;min-height:0;border-radius:0;border-width:1px 0 0}
  .win .rz{display:none}
  .win .tb{cursor:default}
  /* アイコンの列やウィンドウの×ボタンをふさがないよう、タイトルバーの下に出す */
  .toast{top:132px;bottom:auto}
  #narr{position:relative;left:auto;bottom:auto;transform:none;flex:none;width:auto;margin:0 8px 8px;padding:10px 12px 8px}
  #narr .txt{font-size:15px;min-height:3.4em}
  /* 文字を入力している間はキーボードで狭くなるので語りをしまう（typing は JS で付け外しする） */
  #desk.typing #narr{display:none}
  /* タスクバーのボタンはアイコンだけにする（題名を出すと切れて読めないため） */
  #bar #menuBtn,#bar .apps button{font-size:0;gap:0}
  #bar #menuBtn .ic,#bar .apps .ic{font-size:18px}
  #bar .clock{font-size:11px}
  /* 表は横にはみ出すと右の列（手がかりのことがある）に気づけないので、折り返して幅に収める */
  th,td{padding:6px 6px;white-space:normal}
  td.m{white-space:nowrap}
  /* 地図は縮めると文字が読めないので、元に近い大きさのまま横にスクロールさせる */
  .mapview{overflow-x:auto}
  .mapview svg{min-width:620px}
}
/* タッチ操作: 指で押せる大きさにする。入力欄は 16px 未満だと iPhone がタップのたびに画面を拡大してしまう */
@media (pointer:coarse){
  .win .tb{height:44px}
  .win .wb{width:44px;height:40px;font-size:20px}
  #narr .ctl button{padding:5px 14px}
  .term input,.mapbar input,.ans input[type=text]{font-size:16px}
  .term .chips button{font-size:12.5px;padding:7px 10px}
  .btn.sm{padding:9px 14px}
  .results button{padding:11px 12px}
  .slider input{height:32px}
}
/* 大きい画面（4K など）: 見た目はフル HD（ブラウザの枠を除いて約 1920×1000）を基準に作っているので、
   それより広い画面では UI 全体を段階的に拡大する。高さも条件に入れるのは、横長の画面で縦にはみ出さないようにするため */
@media (min-width:2400px) and (min-height:1250px){#screen,.over{zoom:1.25}}
@media (min-width:2880px) and (min-height:1500px){#screen,.over{zoom:1.5}}
@media (min-width:3360px) and (min-height:1750px){#screen,.over{zoom:1.75}}
@media (min-width:3840px) and (min-height:2000px){#screen,.over{zoom:2}}
</style>

  if(/^(whois|curl|view-source|wayback) /.test(k))return '応答がありません。ドメイン名を確認してください。';

let termLog=null,termHist=[];
function initTerm(){
  const T=EPS[EP].term;
  const out=document.getElementById('tout'),f=document.getElementById('tform'),inp=document.getElementById('tin'),chips=document.getElementById('tchips');
  if(termLog===null)termLog=`<span class="dim">${T.banner}</span>\n`;
  out.innerHTML=termLog;out.scrollTop=out.scrollHeight;
  chips.innerHTML=T.chips.map(s=>`<button type="button">${s}</button>`).join('');
  chips.querySelectorAll('button').forEach(b=>b.onclick=()=>{inp.value=b.textContent;inp.focus()});
  // ↑↓ で打ったコマンドを呼び出す
  let pos=termHist.length;
  inp.onkeydown=e=>{
    if(e.key!=='ArrowUp'&&e.key!=='ArrowDown')return;
    e.preventDefault();
    pos=Math.max(0,Math.min(termHist.length,pos+(e.key==='ArrowUp'?-1:1)));
    inp.value=termHist[pos]||'';
  };
  f.onsubmit=e=>{e.preventDefault();const raw=inp.value.trim();if(!raw)return;
    if(termHist[termHist.length-1]!==raw)termHist.push(raw);pos=termHist.length;
    const k=raw.normalize('NFKC').replace(/\s+/g,' ').toLowerCase().replace(/https?:\/\//g,'').replace(/^(\S+ \S+?)\/$/,'$1').replace(/www\./,'');
    if(k==='clear'){termLog='';out.innerHTML='';inp.value='';return}
    const res=Object.hasOwn(T.cmds,k)?T.cmds[k]():T.fallback(k,raw);
    termLog+=`<span class="cmd">$ ${esc(raw)}</span>\n${res}\n\n`;
    out.innerHTML=termLog;out.scrollTop=out.scrollHeight;inp.value='';};
}

 solved:`<p>写真は10月1日より前、<b>9月28日の午前0時台</b>に撮られたものだった。前の晩、透さんは真壁さんの家を訪ねていた。誰かが、その映像の日付を10月11日に書き換えた。預かった証拠を最初に調べるのは、サイバー犯罪対策課だ。</p>
 <p>その夜、私はもう一度、線を越えた。警備会社のサーバーには元の映像が残っていた。9月28日の午前0時37分、足場の前を歩く透さん。10月11日の4時21分の同じ角には、誰も歩いていない。</p>
 <p>私は何もコピーしなかった。違法に手に入れたものは、証拠にならない。元の映像が消えるのは、10月28日の午前0時37分。これを正しく残せるのは、私ではない。</p>`,

 id:5,no:'第五章',title:'聞かれていた部屋',theme:'y2036',mark:'SHINOMIYA RESEARCH',clock:'2036/10/23 13:10',where:'篠宮リサーチ 事務所',
 narr:[['','何事もなかったような顔で事務所に出た。入口の上の角は見ない。'],
  ['','透さんは、事務所の回線を通るものを全部記録に残している。どの機器が、いつ、どれだけのデータを送ったか。一分ごとに、九十日分。'],
  ['','回線は二つ。私たちが使うものと、来客用のもの。来客用は、半年前の合同調査のときに捜査員のために作った。それからは、月に一度の点検でも見ていなかった。'],
  ['','カメラの映像は、動きのない場面ほど小さく縮められる。誰もいない夜の事務所なら、送るデータはほとんど平らな線になるはずだ。']],
 open:['net'],
 steps:[

   memo:'NC330 は 4/14、合同調査の初日から来客用の回線につながったまま。'},
  {type:'text',q:'10月11日の夜、誰もいない事務所で何かが最初に動いたのは何時何分？',

  {type:'choice',q:'翌朝、サイバー犯罪対策課の榊原警部が、書類を持って事務所に来た。<br><span class="say">榊原</span>何度もお邪魔して申し訳ない。<br><span class="say">榊原</span>春日さん、でしたね。ここに来て、何年になります。<br><span class="say">榊原</span>四年。篠宮さんが自分で見つけてきた人だそうですね。優秀なんでしょう。<br>この部屋の会話を聞いていたとわかるのは、どの言葉？',

   memo:'「見つけてきた」は、九月の終わりの夜、この部屋で透さんが口にしただけの言葉。榊原は、天井のカメラで聞いていた。'}
 ],
 hints:['端末で trace utsuro.tv をしたときの「取り込み元」の種類を思い出そう。回線の記録の機器一覧にある。','グラフの日付を 10/11 にして、山をタップすると時刻が出る。03:33〜03:44 は、柊さんが流した11分間。','事務所メモで、合同調査のときに私がどう紹介されたか、九月の終わりの夜に透さんが何と言ったかを確かめよう。'],
 solved:`<p>カメラは<b>4月14日</b>、合同調査の初日から来客用の回線につながっていた。10月11日の<b>3時52分</b>と5時14分、無人の事務所で何かが動いた。透さんのスマホが持ち出され、戻された時刻だ。</p>
 <p>「見つけてきた」。私がここに来た経緯を、透さんは誰にも話していない。あの言葉を聞いたのは、九月の終わりの夜、この部屋でだけだ。七月の夜には、十年前の録画の本当の出どころの話もした。</p>
 <p>透さんの弱みは、一つではなかった。不在証明を出せば宮下家と十年前の録画に行き着き、架純さんは警察にいられなくなる。口を開けば、次は私の名前が出る。透さんは、架純さんと私を守るために黙っている。</p>
 <p>私は、透さんの言いつけを一つだけ破ることにした。</p>`,

 solved:`<p>「九月二十八日の、零時三十七分」と架純さんは繰り返した。「そこまでは、案内にも予定表にも書いてない」。私は答えなかった。架純さんは、ふっと視線を外した。「<b>聞かないでおく</b>」。</p>
 <p>柊さんが名乗った。「十年前、灯籠という名前で録画を渡したのは、僕の父です。宮下沙耶の、父親です」。架純さんは目を閉じて、小さく笑った。「あの人、また私をかばったのね」。</p>
 <p>月曜日、架純さんは十年前の録画の出どころを自分から申し出て、榊原を通さずに令状を取る。柊さんは父の名前を出すと決めた。そして天井のカメラには、外しに来てもらう。</p>`,

},

function answer(c,i,f){
  const st=c.steps[i],fb=$('fb-'+i);
  const bad=m=>{fb.className='feedback bad';fb.textContent=m};
  let shown='';
  if(st.type==='text'){
    const raw=f.querySelector('input').value,v=norm(raw);
    if(!v)return bad('答えを入力してください。');
    if(!st.check(v)){const t=(st.traps||[]).find(t=>t[0].test(v));return bad(t?t[1]:'証拠と合わない。資料をもう一度見直そう。')}
    shown=raw.trim();
  }else if(st.type==='choice'){
    const v=f.querySelector('input:checked')?.value??'';
    if(v==='')return bad('選択肢から選んでください。');
    if(+v!==st.answer)return bad(st.why(+v));
    shown=st.options[st.answer];
  }else{
    const sel=[...f.querySelectorAll('input:checked')].map(x=>+x.value);
    if(!sel.length)return bad('当てはまるものを選んでください。');
    if(!(sel.length===st.answer.length&&st.answer.every(a=>sel.includes(a))))return bad(st.why(sel));
    shown=st.answer.map(a=>st.options[a]).join(' ／ ');
  }
  S.done[c.id+'-'+i]=shown;save();refreshNote();renderMenu();
  WIN.note?.querySelector(`[data-k="${c.id}-${i}"]`)?.classList.add('just');

  if(nxt)nxt.focus({preventScroll:true});
}

function makeDraggable(el){
  const tb=el.querySelector('.tb');
  tb.addEventListener('pointerdown',e=>{
    if(e.target.closest('button')||media('(max-width:760px)'))return;
    // 大きい画面では UI を zoom で拡大しているので、マウスの移動量（画面の px）を拡大率で割って CSS の px に直す
    const d=$('desk'),z=el.getBoundingClientRect().width/el.offsetWidth||1;
    const sx=e.clientX,sy=e.clientY,l0=el.offsetLeft,t0=el.offsetTop;
    tb.setPointerCapture(e.pointerId);
    const move=ev=>{
      el.style.left=Math.max(80-el.offsetWidth,Math.min(l0+(ev.clientX-sx)/z,d.clientWidth-80))+'px';
      el.style.top=Math.max(0,Math.min(t0+(ev.clientY-sy)/z,d.clientHeight-34))+'px';};
    const up=()=>{tb.removeEventListener('pointermove',move);tb.removeEventListener('pointerup',up)};
    tb.addEventListener('pointermove',move);tb.addEventListener('pointerup',up);
  });
  // 右下のつまみで大きさを変える。移動と同じく、マウスの移動量を拡大率で割る

  });

  const finish=()=>{clearInterval(NR.timer);NR.typing=false;txt.textContent=text;if(!last)txt.insertAdjacentHTML('beforeend','<span class="more" aria-hidden="true">▼</span>')};
  if(reduceMotion)finish();
  else{let n=0;NR.typing=true;NR.timer=setInterval(()=>{n+=1;txt.textContent=text.slice(0,n);if(n>=text.length)finish()},26);NR.finish=finish}
  if(NR.key!==null){S.nr[NR.key]=NR.i;save()}
  box.querySelector('[data-nb]').onclick=e=>{e.stopPropagation();if(NR.i>0){NR.i--;showLine()}};
  box.querySelector('[data-nf]').onclick=e=>{e.stopPropagation();advance()};
  box.querySelector('[data-nh]').onclick=e=>{e.stopPropagation();showNarr(false)};
}
function advance(){if(NR.typing){NR.finish();return}if(NR.i<NR.lines.length-1){NR.i++;showLine()}}

// ===== 章の切り替え =====
function renderMenu(){
  const m=$('menu');
  m.innerHTML=`<div class="h">${EPS[EP].file}</div>${CH.map((c,i)=>`<button type="button" data-ch="${i}" class="${i===S.cur?'cur':''}" ${unlocked(i)?'':'disabled'}>${chDone(c)?'✓ ':'　'}${c.no}　${c.title}</button>`).join('')}
   <hr><button type="button" id="mreset">最初からやり直す</button><button type="button" id="mtitle">タイトルに戻る</button>`;
  m.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{toggleMenu(false);enterChapter(+b.dataset.ch)});
  $('mreset').onclick=()=>{
    m.innerHTML=`<div class="confirm">「${EPS[EP].title}」の進行状況を消しますか？ <button class="btn sm" type="button" id="ry">消す</button><button class="btn ghost sm" type="button" id="rn">やめる</button></div>`;
    $('ry').onclick=()=>{S=fresh();termLog=null;termHist=[];MAP={sel:null,q:'',rails:true};hsel=[];save();toggleMenu(false);enterChapter(0)};
    $('rn').onclick=renderMenu;};
  $('mtitle').onclick=()=>{toggleMenu(false);showTitle()};
}
function toggleMenu(open){const m=$('menu');m.hidden=!open;$('menuBtn').setAttribute('aria-expanded',String(open));if(open)renderMenu()}
function toast(who,text,app){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');
  t.innerHTML=`<span class="tile t-chat" style="width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff">${icon('chat')}</span><div><b>${who}</b><span>${text}</span></div>`;
  t.onclick=()=>{t.remove();openApp(app)};
  $('desk').appendChild(t);setTimeout(()=>t.remove(),9000);
}
function enterChapter(i,withCard=true){
  if(!unlocked(i))i=0;
  const from=S.cur;S.cur=i;save();
  const c=CH[i];
  Object.values(WIN).forEach(w=>w.remove());WIN={};cascade=0;
  // 前の章の通知が残ると、押しても開くアプリがないので消す
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  $('screen').className=c.theme;$('desk').dataset.mark=c.mark;$('wall').innerHTML=WALL[c.theme];
  $('clock').innerHTML=c.clock.replace(' ','<br>');
  // quiet のチャットは前に届いたメッセージを読み返すものなので、未読の印も通知も出さない
  const unread=a=>a.id==='chat'&&!c.chat.quiet&&!S.seen['chat'+c.id];
  $('icons').innerHTML=appsOf(c).map(a=>`<button type="button" data-app="${a.id}"><span class="tile t-${a.icon}">${icon(a.icon)}${unread(a)?'<i class="badge" aria-label="未読"></i>':''}</span><span class="lb">${a.name}</span></button>`).join('');
  $('icons').querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>openApp(b.dataset.app));
  openApp('note');c.open.forEach(openApp);
  if(chDone(c))narrate(solvedLines(c));
  else narrate(c.narr,Number.isInteger(S.nr[c.id])?S.nr[c.id]:0,c.id);
  if(c.chat&&!c.chat.quiet&&!S.seen['chat'+c.id]){const m=c.chat.msgs.find(x=>x[0]!=='me');setTimeout(()=>toast(m[0],m[2].replace(/<br>/g,' ').slice(0,40)+'…','chat'),400)}
  renderMenu();
  // 起動の表示（boot）は、前の章から続けて開いたときだけ出す
  if(withCard)showCard(c,from===i-1?c.boot:'');
}
function showCard(c,boot){
  const card=$('card');
  card.innerHTML=`<div class="boot"></div><div class="no">${c.no}</div><h2>${c.title}</h2><div class="wh">${c.clock} ・ ${c.where}</div>`;
  card.classList.remove('out');card.setAttribute('aria-hidden','false');
  const close=()=>{card.classList.add('out');card.setAttribute('aria-hidden','true')};
  card.onclick=close;
  if(boot&&!reduceMotion)card.querySelector('.boot').textContent=boot;
  setTimeout(close,reduceMotion?900:2600);
}
function showTitle(){
  $('title').hidden=false;
  $('title').querySelector('.bgv').innerHTML=roomSVG({noflick:true});
  [[1,'start'],[2,'start2']].forEach(([n,id])=>{
    const b=$(id),started=Object.keys(loadSave(n).done).length>0;
    b.innerHTML=`第${n===1?'一':'二'}話　${EPS[n].title}<small>${started?'つづきから':'はじめる'}</small>`;
    b.onclick=()=>{setEp(n);$('title').hidden=true;enterChapter(S.cur)};
  });
}

function showEnding(){
  const e=$('endov');e.innerHTML=EPS[EP].ending();e.hidden=false;e.scrollTop=0;
  $('endBack').onclick=()=>{e.hidden=true};
  // 第一話の終わりからは第二話へ、第二話の終わりからはタイトルへ進める
  if($('toEp2'))$('toEp2').onclick=()=>{e.hidden=true;setEp(2);enterChapter(S.cur)};
  if($('endTitle'))$('endTitle').onclick=()=>{e.hidden=true;showTitle()};
}

// ===== 起動 =====
$('menuBtn').onclick=()=>toggleMenu($('menu').hidden);
$('narrBtn').onclick=()=>showNarr(true);
$('narr').onclick=advance;
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')toggleMenu(false);
  if((e.key==='Enter'||e.key===' ')&&e.target===document.body&&!$('narr').hidden){e.preventDefault();advance()}
});
document.addEventListener('pointerdown',e=>{if(!$('menu').hidden&&!e.target.closest('#menu,#menuBtn'))toggleMenu(false)});
// 入力中は語りをしまう（狭い画面のみ CSS で効く）。下側だけが動くので入力欄は指の下からずれない。
// 戻すのを遅らせるのは、入力欄の外（「回答する」や×）をタップしたとき、先にレイアウトが動いて別の場所を押したことにならないようにするため。
// iPhone の Safari はタップ中に仕掛けた 0.4 秒以内のタイマーで要素が現れるとクリックを取り消すことがあるので、それより長くしている
let typingTimer;
document.addEventListener('focusin',e=>{if(e.target.matches('.win input:is([type=text],:not([type]))')){clearTimeout(typingTimer);$('desk').classList.add('typing')}});
document.addEventListener('focusout',()=>{
  typingTimer=setTimeout(()=>$('desk').classList.remove('typing'),500);
  // iPhone はキーボードを出すとページ全体をずらし、閉じても戻さないことがある。ずれたままだとタップ位置が合わなくなるので戻す
  if(window.scrollY)window.scrollTo(0,0);
});
showTitle();
</script>
