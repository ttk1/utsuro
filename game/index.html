// 新しいウィンドウを置く場所を決める。開いているウィンドウ・語りとなるべく重ならない場所を粗い格子で探す。
// 広い画面では並び、空きがなければ重なりのいちばん少ない所に置く（前は左上に少しずつずらして重ねていて、
// 記事と表を見比べるたびにタスクバーで切り替える必要があった）。狭い画面では CSS が位置を決めるので、ここの値は使われない
function placeWin(w,h,dw,dh){
  const rects=Object.values(WIN).filter(e=>!e.hidden).map(e=>[e.offsetLeft,e.offsetTop,e.offsetWidth,e.offsetHeight,e.dataset.win==='note'?2.5:1]);
  const nr=$('narr');
  // 語りは left:50% を transform で戻しているので、左端は offsetLeft から幅の半分を引く。語りの下に入ると読めないので重く数える
  if(!nr.hidden&&nr.offsetWidth)rects.push([nr.offsetLeft-nr.offsetWidth/2,nr.offsetTop,nr.offsetWidth,nr.offsetHeight,3]);
  const x1=Math.max(110,dw-w-8),y1=Math.max(14,dh-h-8);
  let best=[110,14],bs=Infinity;
  for(let y=14;y<=y1;y+=22)for(let x=110;x<=x1;x+=22){
    // 左上を少しだけ優先する。別のウィンドウとタイトルバーが重なる位置は避ける（下のウィンドウをつかめなくなるため）
    let s=x*.4+y*.9;
    for(const [rx,ry,rw,rh,k] of rects){
      const ox=Math.min(x+w,rx+rw)-Math.max(x,rx),oy=Math.min(y+h,ry+rh)-Math.max(y,ry);
      if(ox>0&&oy>0)s+=ox*oy*k;
      if(k===1&&Math.abs(x-rx)<40&&Math.abs(y-ry)<30)s+=1e7;
    }
    if(s<bs){bs=s;best=[x,y]}
  }
  return best;
}
function focusWin(id){
  Object.values(WIN).forEach(w=>w.classList.remove('on'));
  const w=WIN[id];w.classList.add('on');w.style.zIndex=++zTop;renderTasks();
}
function makeDraggable(el){
  const tb=el.querySelector('.tb');
  tb.addEventListener('pointerdown',e=>{
    if(e.target.closest('button')||media('(max-width:760px)'))return;
    // 大きい画面では UI を zoom で拡大しているので、マウスの移動量（画面の px）を拡大率で割って CSS の px に直す
    const d=$('desk'),z=el.getBoundingClientRect().width/el.offsetWidth||1;
    const sx=e.clientX,sy=e.clientY,l0=el.offsetLeft,t0=el.offsetTop;
    tb.setPointerCapture(e.pointerId);
    const move=ev=>{
      el.style.left=Math.max(80-el.offsetWidth,Math.min(l0+(ev.clientX-sx)/z,d.clientWidth-80))+'px';
      el.style.top=Math.max(0,Math.min(t0+(ev.clientY-sy)/z,d.clientHeight-34))+'px';};
    const up=()=>{tb.removeEventListener('pointermove',move);tb.removeEventListener('pointerup',up)};
    tb.addEventListener('pointermove',move);tb.addEventListener('pointerup',up);
  });
  // 右下のつまみで大きさを変える。移動と同じく、マウスの移動量を拡大率で割る
  const rz=el.querySelector('.rz');
  rz.addEventListener('pointerdown',e=>{
    e.preventDefault();
    const d=$('desk'),z=el.getBoundingClientRect().width/el.offsetWidth||1;
    const sx=e.clientX,sy=e.clientY,w0=el.offsetWidth,h0=el.offsetHeight;
    rz.setPointerCapture(e.pointerId);
    const move=ev=>{
      el.style.width=Math.max(260,Math.min(w0+(ev.clientX-sx)/z,d.clientWidth-el.offsetLeft))+'px';
      el.style.height=Math.max(160,Math.min(h0+(ev.clientY-sy)/z,d.clientHeight-el.offsetTop))+'px';};
    const up=()=>{rz.removeEventListener('pointermove',move);rz.removeEventListener('pointerup',up)};
    rz.addEventListener('pointermove',move);rz.addEventListener('pointerup',up);
  });
}
function renderTasks(){

// ===== 語り =====
// sol: 解明の語りを読んでいる章の id（読んだ段落までをノートに出す）。hold: 対決の次の言い分を、この語りを読み終えるまで出さない
let NR={lines:[],i:0,timer:null,typing:false,key:null,sol:null,hold:false};
// beat: 最初の行を出しはじめるまでの間（ミリ秒）。対決で言い分を崩した直後、崩れる演出を見せてから次のせりふを出す
function narrate(lines,start=0,key=null,opt={}){NR={...NR,lines,i:Math.min(start,lines.length-1),key,sol:opt.sol??null,hold:!!opt.hold,beat:opt.beat||0};showNarr(true);showLine()}
// 語りをしまったら、語りを待っていたもの（解明の続き、対決の次の言い分）はすぐ出す
function showNarr(on){
  $('narr').hidden=!on;$('narrBtn').hidden=on;
  if(on){NR.pend=false;$('narrBtn').classList.remove('new');document.querySelectorAll('.whisper').forEach(t=>t.remove());toastPos();return}
  if(NR.sol!=null){NR.sol=null;drawSolved()}
  if(NR.hold){NR.hold=false;refreshNote()}
  // 語りの行に付けた仕掛け（配信が映る、通知が届く）も、語りをしまったら待たせない
  if(NR.key!=null){NR.lines.slice(NR.i+1).forEach(l=>l[3]?.());S.nr[NR.key]=NR.lines.length-1;save();chatNotify()}
  toastPos();
}
function showLine(){

  if(NR.hold&&last){NR.hold=false;refreshNote()}
  if(NR.sol!=null)drawSolved();

  // スマホでは解いた瞬間に別のアプリが前に出ていることが多い）。それ以外の最後の行には、次にすることを一言添える
  const c=CH[S.cur],fin=last&&chDone(c);
  box.innerHTML=`<div class="who ${kind||''}">${kind==='frame'?'2036 ・ ミオ':who}</div><div class="txt ${kind||''}"></div>
   <div class="ctl"><span>${NR.i+1} / ${NR.lines.length}${last&&!fin?'　― 捜査ノートとアプリで調べよう':''}</span>${fin?`<button type="button" class="nn" data-nn>${nextLabel(c)}</button>`:''}<button type="button" data-nb aria-label="前へ">‹</button><button type="button" data-nf aria-label="次へ">›</button><button type="button" data-nh>隠す</button></div>`;
  const txt=box.querySelector('.txt');
  clearInterval(NR.timer);clearTimeout(NR.timer);
  const finish=()=>{clearInterval(NR.timer);clearTimeout(NR.timer);NR.typing=false;txt.textContent=text;if(!last)txt.insertAdjacentHTML('beforeend','<span class="more" aria-hidden="true">▼</span>');else if(NR.sol!=null){NR.sol=null;drawSolved()}};
  if(reduceMotion)finish();
  else{
    let n=0;NR.typing=true;NR.finish=finish;
    const type=()=>{NR.timer=setInterval(()=>{n+=1;txt.textContent=text.slice(0,n);if(n>=text.length)finish()},26)};
    // 間（beat）は一度きり。待っているあいだに押されたら、finish が全文を出す
    if(NR.beat){NR.timer=setTimeout(type,NR.beat);NR.beat=0}else type();
  }
  // 読んだ位置は、いちばん先まで読んだ行を残す（戻って読み返しても、届いた通知や映った配信は元に戻さない）
  if(NR.key!==null){S.nr[NR.key]=Math.max(S.nr[NR.key]||0,NR.i);save();NR.lines[NR.i][3]?.();chatNotify()}
  toastPos();
  box.querySelector('[data-nb]').onclick=e=>{e.stopPropagation();if(NR.i>0){NR.i--;showLine()}};

  const nn=box.querySelector('[data-nn]');if(nn)nn.onclick=e=>{e.stopPropagation();goNext()};
}

function drawCast(){

// ===== つかみ =====
// 第一話を初めて始めるとき、序章の前に「うつろ放送」を十数秒だけ見せる（題材の絵を、説明より先に見せる）。
// 黒い画面にトップページの文句 → 時計が 3:33 に変わる → 部屋が映る → 何も起きない → 早回しで 03:44 → 唐突に黒 → 序章。
// 押すか Enter・Esc で飛ばせる。一度見たら PREF.cold に残し、二度目からは出さない。
// 動きを減らす設定では、にじませず、早回しもせずに短く見せる。効果音が「あり」なら、映っているあいだだけ配信の音（liveSound）を鳴らす
function coldOpen(done){
  const el=$('cold'),ts=[],at=(ms,f)=>ts.push(setTimeout(f,ms));
  el.innerHTML=`<div class="cbox"><div class="site"><div class="body">${SITE_TOP}</div></div>${stream(roomSVG(),'LIVE うつろ放送','')}</div><div class="cfoot"><span>押すと飛ばせます</span><b>3:32</b></div>`;
  el.hidden=false;
  const box=el.querySelector('.cbox'),tr=el.querySelector('.tr'),clk=el.querySelector('.cfoot b');
  let t=0,view=11,iv=null,snd=null,over=false;
  const draw=()=>{tr.innerHTML=`${stamp(Math.min(t,659))}<br>視聴 ${view}`;clk.textContent=`3:${33+Math.floor(Math.min(t,660)/60)}`};
  const finish=()=>{
    if(over)return;over=true;
    ts.forEach(clearTimeout);clearInterval(iv);snd?.stop();document.removeEventListener('keydown',key);
    PREF.cold=true;savePref();el.hidden=true;el.innerHTML='';done();
  };
  // 03:44 に、終わりの表示も出さずに黒へ戻る。音もそこで切れる
  const cut=()=>{clearInterval(iv);snd?.stop();snd=null;box.className='cbox off';at(1500,finish)};
  const key=e=>{if(['Enter',' ','Escape'].includes(e.key)){e.preventDefault();finish()}};
  el.onclick=finish;document.addEventListener('keydown',key);
  if(PREF.sound)audio();
  const T=reduceMotion?[1500,2200]:[2600,3400]; // 時計が 3:33 に変わる、部屋が映る
  at(T[0],()=>{clk.textContent='3:33'});
  at(T[1],()=>{
    box.classList.add('on');draw();if(PREF.sound)snd=liveSound();
    iv=setInterval(()=>{t++;draw()},1000);
  });
  // 視聴者が一人増える（いま見はじめた一人）
  at(T[1]+1800,()=>{view=12;draw()});
  if(reduceMotion)return at(T[1]+3500,cut);
  // 6 秒は実時間で何も起きない。そのあと残りの十一分を 3 秒で早回しする（貨物の通る二度だけ、画面がかすかに揺れる）
  at(T[1]+6000,()=>{
    clearInterval(iv);
    iv=setInterval(()=>{
      t+=11;const r=RUMBLE.some(([a,b])=>t>=a&&t<b);
      box.classList.toggle('rumble',r);snd?.rumble(r);draw();
      if(t>=660)cut();
    },50);
  });
}

// ===== 対決の時間制限 =====
// 対決のあいだ、相手がしびれを切らすまでの残りをゲージで出す。切れたら1回まちがえたのと同じ扱いにして、ゲージを戻す。
// ゆっくり読みたい人のために、メニューで切れる。動きを減らす設定（prefers-reduced-motion）のときは初めから「なし」
const FUSE_MAX=90;
let fuse=FUSE_MAX;
const timed=()=>PREF.timer??!reduceMotion;
const duelNow=()=>{const s=curStep();return s&&isDuel(s.st)?s:null};
// タブが隠れているとき、メニュー・タイトル・章扉・エンディングが出ているときは止める。
// 語りに読んでいない続きがあるあいだも止める（対決の前の場面を読んでいるうちに減ると理不尽なため）
const fusePaused=()=>document.hidden||!$('menu').hidden||!$('title').hidden||!$('endov').hidden||!$('card').classList.contains('out');
// 語りに未読の続きがあるあいだも止めるが、一つの言い分につき合計 NARR_GRACE 秒まで。
// 上限がないと、語りをわざと読み終えずにおけば、時間を使わずに考えられてしまう
const NARR_GRACE=20;let narrGrace=NARR_GRACE;
const narrUnread=()=>!$('narr').hidden&&NR.i<NR.lines.length-1;
function fuseDraw(){
  const on=!!duelNow()&&timed()&&!NR.hold;
  $('fuse').hidden=!on;
  if(on)document.querySelectorAll('.fusebar').forEach(b=>{b.firstElementChild.style.width=fuse/FUSE_MAX*100+'%';b.classList.toggle('low',fuse<=20)});
}
function fuseReset(){fuse=FUSE_MAX;narrGrace=NARR_GRACE;fuseDraw()}
function fuseTick(){
  const s=duelNow();
  // 言い分がまだ出ていないあいだ（前の語りを読んでいるところ）は減らさない
  if(!s||!timed()||fusePaused()||NR.hold)return;
  if(narrUnread()&&narrGrace>0){narrGrace--;return}
  if(--fuse>0)return fuseDraw();
  // 時間切れ。相手の一言は miss が語りに出す（3回目なら、立て直しのせりふが代わりに出る）
  miss(s.c,s.i,`${s.c.foe}「${s.c.timeout}」 ― 時間切れ。`);
}
setInterval(fuseTick,1000);

document.addEventListener('click',e=>{
  const un=e.target.closest('[data-un]');
  if(un){e.preventDefault();grab(un.dataset.un)}
  else if(e.target.closest('[data-tonote]'))openApp('note');
  else if(e.target.closest('[data-go]')){
    openApp('note');
    const s=picking(),f=s&&WIN.note.querySelector(`form[data-s="${s.i}"]`);
    if(f)answer(s.c,s.i,f);
  }
});
$('menuBtn').onclick=()=>toggleMenu($('menu').hidden);
$('narrBtn').onclick=openNarr;
$('narr').onclick=advance;
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')toggleMenu(false);
  if((e.key==='Enter'||e.key===' ')&&e.target===document.body&&!$('narr').hidden){e.preventDefault();advance()}
});
document.addEventListener('pointerdown',e=>{if(!$('menu').hidden&&!e.target.closest('#menu,#menuBtn'))toggleMenu(false)});
// 入力中は語りをしまう（狭い画面のみ CSS で効く）。下側だけが動くので入力欄は指の下からずれない。
// 戻すのを遅らせるのは、入力欄の外（「回答する」や×）をタップしたとき、先にレイアウトが動いて別の場所を押したことにならないようにするため。
// iPhone の Safari はタップ中に仕掛けた 0.4 秒以内のタイマーで要素が現れるとクリックを取り消すことがあるので、それより長くしている
let typingTimer;
document.addEventListener('focusin',e=>{if(e.target.matches('.win input:is([type=text],:not([type]))')){clearTimeout(typingTimer);$('desk').classList.add('typing')}});
document.addEventListener('focusout',()=>{
  typingTimer=setTimeout(()=>$('desk').classList.remove('typing'),500);
  // iPhone はキーボードを出すとページ全体をずらし、閉じても戻さないことがある。ずれたままだとタップ位置が合わなくなるので戻す
  if(window.scrollY)window.scrollTo(0,0);
});
showTitle();
</script>
