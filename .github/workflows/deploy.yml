name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# ワークフロー全体は読み取りのみ。デプロイ権限は deploy ジョブだけに付与する
# (テスト中に動く npm 依存のコードに pages:write を渡さないため)
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

# Action はタグの付け替えに影響されないようコミット SHA で固定する（公開から7日以上たった版）
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # .npmrc（min-release-age、ignore-scripts）と package-lock.json の integrity がここでも効く
      - run: npm ci --no-audit --no-fund
      # 全章を通しプレイできなければ公開しない
      - run: npm test
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: game

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
